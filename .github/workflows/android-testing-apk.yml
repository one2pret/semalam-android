name: Android Testing APK

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and Unit Test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android platform on hosted runner
        run: |
          sdkmanager --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Prepare optional stable testing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SEMALAM_TESTING_KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/semalam-testing.jks"
          echo "SEMALAM_KEYSTORE_PATH=$RUNNER_TEMP/semalam-testing.jks" >> "$GITHUB_ENV"
      - name: Unit tests and APK build
        env:
          SEMALAM_KEYSTORE_PASSWORD: ${{ secrets.SEMALAM_TESTING_STORE_PASSWORD }}
          SEMALAM_KEY_ALIAS: ${{ secrets.SEMALAM_TESTING_KEY_ALIAS }}
          SEMALAM_KEY_PASSWORD: ${{ secrets.SEMALAM_TESTING_KEY_PASSWORD }}
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - name: Upload testing APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: semalam-android-testing-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
