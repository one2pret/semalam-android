name: Signed Semalam Testing APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  signed-testing:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Verify signing secrets before build
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.SEMALAM_TESTING_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.SEMALAM_TESTING_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SEMALAM_TESTING_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.SEMALAM_TESTING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo "::error::Missing SEMALAM_TESTING_KEYSTORE_BASE64"; exit 1; }
          test -n "$STORE_PASSWORD" || { echo "::error::Missing SEMALAM_TESTING_STORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "::error::Missing SEMALAM_TESTING_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASSWORD" || { echo "::error::Missing SEMALAM_TESTING_KEY_PASSWORD"; exit 1; }
          mkdir -p "$RUNNER_TEMP/semalam"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/semalam/testing.jks"
          chmod 600 "$RUNNER_TEMP/semalam/testing.jks"
          echo "SEMALAM_KEYSTORE_PATH=$RUNNER_TEMP/semalam/testing.jks" >> "$GITHUB_ENV"
      - name: Install Android platform
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -print -quit)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Verify key and build signed APK
        shell: bash
        env:
          SEMALAM_KEYSTORE_PASSWORD: ${{ secrets.SEMALAM_TESTING_STORE_PASSWORD }}
          SEMALAM_KEY_ALIAS: ${{ secrets.SEMALAM_TESTING_KEY_ALIAS }}
          SEMALAM_KEY_PASSWORD: ${{ secrets.SEMALAM_TESTING_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          keytool -list -keystore "$SEMALAM_KEYSTORE_PATH" -storepass "$SEMALAM_KEYSTORE_PASSWORD" -alias "$SEMALAM_KEY_ALIAS" >/dev/null
          gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug
          APK=$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)
          test -n "$APK" && test -s "$APK"
          APKSIGNER=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -type f -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK" | grep -E 'Verified using v|Signer #1 certificate SHA-256 digest'
      - name: Upload signed testing APK
        uses: actions/upload-artifact@v4
        with:
          name: semalam-stable-signed-testing-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
      - name: Remove temporary keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/semalam/testing.jks"
