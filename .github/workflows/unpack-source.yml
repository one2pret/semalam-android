name: Expand Semalam source bootstrap

on:
  push:
    branches:
      - feature/semalam-audio-prototype-v0.1
  workflow_dispatch:

permissions:
  contents: write

jobs:
  expand:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout prototype branch
        uses: actions/checkout@v4
        with:
          ref: feature/semalam-audio-prototype-v0.1
          persist-credentials: true
      - name: Expand initial source snapshot
        shell: bash
        run: |
          set -euo pipefail
          file=bootstrap/semalam-core.tar.xz.b64
          if [ ! -f "$file" ]; then
            echo "No bootstrap archive yet; nothing to expand."
            exit 0
          fi
          base64 --decode "$file" > "$RUNNER_TEMP/semalam-core.tar.xz"
          tar -tJf "$RUNNER_TEMP/semalam-core.tar.xz" | grep -q '^semalam-android/app/build.gradle.kts$'
          tar -xJf "$RUNNER_TEMP/semalam-core.tar.xz" -C . --strip-components=1
          rm -f "$file" .github/workflows/unpack-source.yml
          rmdir bootstrap 2>/dev/null || true
          mkdir -p docs
          cat > docs/BOOTSTRAP_NOTES.md <<'NOTE'
          # Semalam bootstrap notes

          Initial Android source imported for audio feasibility.
          Do not merge to main until CI unit tests and APK assembly pass.

          ## Android smoke test
          1. Install testing APK and grant microphone permission.
          2. Start session while app is open; wait 12 seconds for calibration.
          3. Make a clear sound for 2 seconds; wait 3 seconds; stop.
          4. Check local clip playback and deletion.
          5. Repeat with screen locked, then test overnight only after successful short sessions.

          No medical inference, speaker recognition, or automatic snore labeling.
          NOTE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes"
          else
            git commit -m "feat: expand Semalam Kotlin audio prototype"
            git push origin HEAD:feature/semalam-audio-prototype-v0.1
          fi
